<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Tape Simulator - Quirky Bureaucracy Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128203;</text></svg>">
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Loading bureaucracy...</p>
  </div>

  <!-- MENU SCREEN -->
  <div id="menu-screen" class="hidden">
    <div class="menu-container">
      <img src="assets/Red Tape Simulator Title.png" alt="Red Tape Simulator title" class="menu-title-art" onerror="this.style.display='none'">
      <p class="game-subtitle">A Quirky Bureaucracy Simulator</p>
      <div class="menu-buttons">
        <button id="menu-continue-btn" class="btn btn-primary">Continue</button>
        <button id="menu-load-file-btn" class="btn">Load Game</button>
        <button id="menu-new-file-btn" class="btn">New Game</button>
        <button id="menu-settings-btn" class="btn">Settings</button>
        <button id="menu-credits-btn" class="btn">Credits</button>
        <button id="menu-exit-btn" class="btn">Exit</button>
      </div>
      <div id="menu-panel" class="hidden"></div>
    </div>
  </div>

  <!-- SHIFT START SCREEN -->
  <div id="shift-start-screen" class="hidden">
    <div class="shift-start-container">
      <div id="shift-start-content"></div>
      <button id="begin-shift-btn" class="btn btn-primary">Begin Shift</button>
    </div>
  </div>

  <!-- MAIN GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <!-- HUD -->
    <div class="game-hud">
      <div class="hud-left">
        <div class="hud-item">
          <span class="label">Time</span>
          <span class="value" id="clock-display">8:00 AM</span>
        </div>
        <div class="hud-item">
          <span class="label">Queue</span>
          <span class="value" id="queue-counter">0/0</span>
        </div>
      </div>
      <div class="hud-center">
        <div class="hud-item">
          <span class="label">Shift Progress</span>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="shift-progress" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-item hud-overtime hidden" id="overtime-indicator" aria-live="polite">
          <span class="label">Status</span>
          <span class="value">Overtime</span>
        </div>
        <div class="hud-item">
          <span class="label">Money</span>
          <span class="value" id="money-display">$0</span>
        </div>
        <div class="hud-item" id="performance-indicator">
          <span class="label">DMV</span>
          <span class="value">Clerk</span>
        </div>
      </div>
    </div>

    <!-- Main game area -->
    <div class="game-main" id="DMVDeskUI">
      <!-- Center: Documents -->
      <div id="document-panel">
        <div id="document-tabs"></div>
        <div id="document-content"></div>
      </div>

      <!-- Right: Flags + Decision -->
      <div class="right-panel">
        <div id="flags-panel">
          <h3>Conditions & Flags</h3>
        </div>
        <div id="decision-panel">
          <h3>Your Decision</h3>
          <button id="approve-btn" class="btn btn-success">Approve</button>
          <button id="deny-btn" class="btn btn-danger">Deny</button>
          <button id="pay-fine-btn" class="btn">Collect Fine Payment</button>
          <div id="deny-reasons"></div>
          <button id="escalate-btn" class="btn btn-warning">Escalate to Supervisor</button>
        </div>
      </div>
    </div>



    <!-- Customer across desk strip -->
    <div id="customer-desk-strip">
      <div id="desk-customer-avatar" aria-label="Customer avatar placeholder"></div>
      <div id="desk-customer-chat"></div>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="hidden">
      <div>
        <div id="result-content"></div>
        <button id="next-customer-btn" class="btn btn-primary">Next Customer</button>
      </div>
    </div>

    <!-- Bribe Overlay -->
    <div id="bribe-overlay" class="hidden">
      <div>
        <div id="bribe-content"></div>
        <div class="bribe-buttons">
          <button id="accept-bribe-btn" class="btn btn-warning">Accept Bribe</button>
          <button id="decline-bribe-btn" class="btn btn-success">Decline</button>
        </div>
      </div>
    </div>

    <!-- Document Request Decision Overlay -->
    <div id="doc-request-overlay" class="hidden">
      <div>
        <div id="doc-request-content"></div>
        <div id="doc-request-actions" class="doc-request-actions"></div>
      </div>
    </div>

    <!-- Parking Fine Payment Mini-Game Overlay -->
    <div id="fine-payment-overlay" class="hidden">
      <div>
        <div id="fine-payment-content"></div>
      </div>
    </div>

    <!-- Deny Reason Overlay -->
    <div id="deny-reason-overlay" class="hidden">
      <div class="deny-reason-card">
        <h3>Select Denial Reason</h3>
        <p>Choose the policy reason before applying the DENY stamp.</p>
        <div id="deny-reason-list" class="deny-reason-list"></div>
        <div class="deny-reason-actions">
          <button id="cancel-deny-reason-btn" type="button" class="btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- EVENT BANNER -->
  <div id="event-banner" class="hidden">
    <span id="event-text"></span>
  </div>

  <!-- REVIEW SCREEN -->
  <div id="review-screen" class="hidden">
    <div id="review-shell" class="review-shell">
      <div id="review-content"></div>
      <button id="continue-btn" class="btn btn-primary">Continue</button>
    </div>
  </div>

  <!-- NOTIFICATION AREA -->
  <div id="notification-area"></div>

  <!-- GAME SCRIPTS -->
  <script type="module">
    import { Game } from './js/game.js';
    import { UIRenderer } from './js/ui/renderer.js';

    const game = new Game();
    const ui = new UIRenderer(game);

    async function start() {
      try {
        await game.init();
        ui.init();
      } catch (err) {
        console.error('Failed to initialize game:', err);
        document.getElementById('loading-screen').innerHTML =
          `<p style="color:#f44336">Failed to load game: ${err.message}</p>`;
      }
    }

    start();
  </script>
</body>
</html>
